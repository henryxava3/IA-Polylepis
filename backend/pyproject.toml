[project]
name = "polylepis-local"
version = "0.1.0"
description = "Biblioteca y geovisor científico local de Polylepis"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "pypdf>=5,<7",
  "fastembed>=0.6,<1", "rank-bm25>=0.2.2,<0.3", "numpy>=2,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
